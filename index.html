function nowBudapest(){const f=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Budapest",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}),x=f.formatToParts(new Date()),dm={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};return {day:dm[x.find(i=>i.type==="weekday").value],time:`${x.find(i=>i.type==="hour").value}:${x.find(i=>i.type==="minute").value}`};}

 const m=range.match(/(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})/);
 if(!m)return null;

}

function rawOpeningStatus(raw){

function status(p){
 if(!p.opening_hours)return {label:p.special?`📅 ${p.special}`:"שעות פתיחה לא זמינות",open:null};
 if(typeof p.opening_hours==="string")return rawOpeningStatus(p.opening_hours);

function dist(a,b){const R=6371000,dla=(b.latitude-a.lat)*Math.PI/180,dlo=(b.longitude-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.latitude*Math.PI/180,x=Math.sin(dla/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}

  const u=`https://api.geoapify.com/v1/routing?waypoints=${userPos.lat},${userPos.lng}|${p.latitude},${p.longitude}&mode=walk&format=json&apiKey=${GEO_KEY}`;

}
function guessCategory(name,cats=[],props={}){
 const raw=props.datasource?.raw||{};
 const s=(name+" "+cats.join(" ")+" "+JSON.stringify(raw)).toLowerCase();
 if(/catering\.cafe|coffee_shop|cafe|coffee/.test(s))return "בתי קפה";
 if(/catering\.(bar|pub)|nightclub|cocktail|pub\b|bar\b/.test(s))return "ברים";
 if(/commercial\.marketplace|marketplace|market\b|piac/.test(s))return "שווקים";
 if(/catering|restaurant|fast_food|food_court|pizza|burger|sushi|cuisine/.test(s))return "אוכל";
 if(/museum|attraction|tourism|heritage|monument|castle|stadium|sport|bath|spa|park|island|viewpoint|gallery|theatre|cinema/.test(s))return "אטרקציות";
 return "מקומות יפים";
}
function cuisineHebrew(raw){
 const map={japanese:"יפני",sushi:"סושי",asian:"אסייתי",mexican:"מקסיקני",hungarian:"הונגרי",italian:"איטלקי",pizza:"פיצה",burger:"המבורגרים",thai:"תאילנדי",vietnamese:"וייטנאמי",chinese:"סיני",indian:"הודי",mediterranean:"ים־תיכוני",vegan:"טבעוני",vegetarian:"צמחוני"};
 const parts=String(raw||"").toLowerCase().split(/[;,|]/).map(x=>x.trim()).filter(Boolean);
 const out=[...new Set(parts.map(x=>map[x]).filter(Boolean))];
 return out.slice(0,2).join(" ו");
}
function areaHebrew(props){
 const a=props.district||props.suburb||props.neighbourhood||props.city_district||"";
 if(!a)return "";
 if(/erzsébetváros|7th district/i.test(a))return "ברובע היהודי";
 if(/terézváros|6th district/i.test(a))return "ברובע השישי";
 if(/lipótváros|5th district|belváros/i.test(a))return "במרכז פשט";
 return `באזור ${a}`;
}
function exactHebrewDescription(name,cat,cats=[],props={}){
 const raw=props.datasource?.raw||{};
 const s=(cats.join(" ")+" "+JSON.stringify(raw)).toLowerCase();
 const area=areaHebrew(props);
 const cuisine=cuisineHebrew(raw.cuisine||raw["cuisine:1"]||"");
 const brand=props.brand||raw.brand||"";
 let first="",second="";
 if(cat==="אוכל"){
  if(/food_court|street_food/.test(s)) first=`${name} הוא מתחם אוכל רחוב ${area||"בבודפשט"}, עם כמה דוכנים ומבחר אפשרויות במקום אחד.`;
  else if(/fast_food/.test(s)) first=`${name} הוא מקום אוכל קליל ${area||"בבודפשט"}${cuisine?`, בסגנון ${cuisine}`:""}.`;
  else first=`${name} הוא ${cuisine?`מקום אוכל ${cuisine}`:"מסעדה"} ${area||"בבודפשט"}.`;
  if(/outdoor_seating|outdoor/.test(s))second="יש במקום גם ישיבה בחוץ, כך שהוא מתאים במיוחד לעצירה קלילה במהלך היום או בערב.";
  else second="מתאים לעצירה לארוחה כשנמצאים באזור.";
 } else if(cat==="בתי קפה"){
  first=`${name} הוא בית קפה ${area||"בבודפשט"}.`;
  second=/breakfast|brunch/.test(s)?"מתאים לקפה, בראנץ׳ או ארוחת בוקר.":"מתאים לעצירה לקפה ומשהו מתוק במהלך הטיול.";
 } else if(cat==="ברים"){
  first=`${name} הוא ${/nightclub/.test(s)?"מקום בילוי לילי":"בר"} ${area||"בבודפשט"}.`;
  second=/cocktail/.test(s)?"מתאים במיוחד לקוקטיילים ודרינק בערב.":"מתאים לדרינק ואווירת ערב.";
 } else if(cat==="שווקים"){
  first=`${name} הוא שוק ${area||"בבודפשט"}.`;
  second="מתאים להסתובבות בין דוכנים ולחיפוש אוכל מקומי ומוצרים מיוחדים.";
 } else if(cat==="אטרקציות"){
  if(/museum/.test(s))first=`${name} הוא מוזיאון ${area||"בבודפשט"}.`;
  else if(/park|island/.test(s))first=`${name} הוא אזור ירוק ונעים ${area||"בבודפשט"}.`;
  else if(/viewpoint/.test(s))first=`${name} הוא נקודת תצפית ${area||"בבודפשט"}.`;
  else first=`${name} הוא אטרקציה ${area||"בבודפשט"}.`;
  second=/park|island/.test(s)?"מתאים להליכה רגועה, עצירות וצילום.":"כדאי לשלב אותו כשנמצאים באזור ובהתאם לזמן שיש לכם.";
 } else {
  first=`${name} הוא מקום מעניין ${area||"בבודפשט"}.`;
  second="שווה לשמור אותו ברשימה ולעבור בו כשנמצאים באזור.";
 }
 if(brand&&normalizeName(brand)!==normalizeName(name))second+=` המקום מזוהה עם ${brand}.`;
 return (first+" "+second).replace(/\s+/g," ").trim();
}
const BUDAPEST_CENTER={lon:19.0402,lat:47.4979};
const PLACE_CATEGORIES=[
 "catering","commercial","entertainment","tourism","leisure","sport",
 "heritage","building","service","accommodation"
].join(",");

function searchScore(p,q){
 const n=normalizeName(p.name||p.address_line1||"");
 const needle=normalizeName(q);
 let score=0;
 if(n===needle)score+=100;
 else if(n.startsWith(needle))score+=70;
 else if(n.includes(needle))score+=45;
 if(p.city==="Budapest"||/Budapest/i.test(p.formatted||""))score+=20;
 if(p.place_id)score+=5;
 if(p.categories?.length)score+=8;
 if(p.result_type==="amenity"||p.type==="amenity")score+=10;
 if(/administrative|district|postcode|street|city/i.test((p.result_type||"")+" "+(p.category||"")))score-=80;
 return score;
}
function dedupeResults(items){
 const seen=new Set();
 return items.filter(x=>{
  const key=x.place_id||`${normalizeName(x.name||x.address_line1)}|${Number(x.lat).toFixed(4)}|${Number(x.lon).toFixed(4)}`;
  if(seen.has(key))return false;seen.add(key);return true;
 });
}
async function placesByName(q){
 try{
  const u=`https://api.geoapify.com/v2/places?categories=${encodeURIComponent(PLACE_CATEGORIES)}&filter=circle:${BUDAPEST_CENTER.lon},${BUDAPEST_CENTER.lat},25000&bias=proximity:${BUDAPEST_CENTER.lon},${BUDAPEST_CENTER.lat}&name=${encodeURIComponent(q)}&limit=20&lang=en&apiKey=${GEO_KEY}`;
  const r=await fetch(u);if(!r.ok)return[];
  const j=await r.json();
  return (j.features||[]).map(f=>({...f.properties,result_type:"amenity"}));
 }catch(e){return[];}
}
async function amenityAutocomplete(q){
 try{
  const u=`https://api.geoapify.com/v1/geocode/autocomplete?text=${encodeURIComponent(q)}&type=amenity&format=json&lang=en&limit=10&filter=circle:${BUDAPEST_CENTER.lon},${BUDAPEST_CENTER.lat},25000&bias=proximity:${BUDAPEST_CENTER.lon},${BUDAPEST_CENTER.lat}&apiKey=${GEO_KEY}`;
  const r=await fetch(u);if(!r.ok)return[];
  const j=await r.json();return j.results||[];
 }catch(e){return[];}
}
async function geoAutocomplete(q){
 const needle=String(q||"").trim();if(needle.length<2)return[];
 // Two independent place-oriented searches. Administrative/city results are deliberately excluded.
 const [places,amenities]=await Promise.all([placesByName(needle),amenityAutocomplete(needle)]);
 let all=dedupeResults([...places,...amenities]).filter(x=>{
  const text=((x.result_type||"")+" "+(x.category||"")+" "+(x.categories||[]).join(" ")).toLowerCase();
  return !/administrative|postcode/.test(text) && (x.city==="Budapest"||/Budapest/i.test(x.formatted||""));
 });
 all.sort((a,b)=>searchScore(b,needle)-searchScore(a,needle));
 if(all.length)return all.slice(0,8);

 // Fallback: broader amenity search with "Budapest" added to the query.
 try{
  const u=`https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(needle+" Budapest Hungary")}&type=amenity&format=json&lang=en&limit=10&filter=countrycode:hu&bias=proximity:${BUDAPEST_CENTER.lon},${BUDAPEST_CENTER.lat}&apiKey=${GEO_KEY}`;
  const r=await fetch(u);if(!r.ok)return[];
  const j=await r.json();
  all=dedupeResults(j.results||[]).filter(x=>x.city==="Budapest"||/Budapest/i.test(x.formatted||""));
  all.sort((a,b)=>searchScore(b,needle)-searchScore(a,needle));
  return all.slice(0,8);
 }catch(e){return[];}
}
async function geoDetails(placeId){
 if(!placeId)return null;
 try{
  const u=`https://api.geoapify.com/v2/place-details?id=${encodeURIComponent(placeId)}&features=details&lang=en&apiKey=${GEO_KEY}`;
  const r=await fetch(u);if(!r.ok)return null;
  const j=await r.json();
  return j.features?.find(f=>f.properties?.feature_type==="details")?.properties||j.features?.[0]?.properties||null;
 }catch(e){return null;}
}
function exactImage(props){
 // Safety rule: ONLY use an image explicitly attached to this exact Geoapify place.
 const candidates=[
  props?.wiki_and_media?.image,
  props?.wiki_and_media?.image_url,
  props?.datasource?.raw?.image,
  props?.datasource?.raw?.image_url
 ].filter(Boolean);
 return candidates.find(x=>/^https?:\/\//i.test(String(x)))||null;
}
function renderSuggestions(list){
 const box=document.getElementById("suggestions");box.innerHTML="";
 list.forEach(r=>{
  const b=document.createElement("button");b.type="button";b.className="suggestion";
  const label=r.name||r.address_line1||r.formatted?.split(",")[0]||"מקום";
  const kind=(r.category||"").split(".").pop()?.replaceAll("_"," ")||"";
  b.innerHTML=`<b>${label}</b><span>${r.formatted||""}${kind?` · ${kind}`:""}</span>`;
  b.onclick=()=>{
   selectedResult=r;
   document.getElementById("placeName").value=label;
   if(!document.getElementById("placeCat").value)document.getElementById("placeCat").value=guessCategory(label,r.category?[r.category]:[],r);
   box.innerHTML="";
   document.getElementById("addStatus").textContent="מצאתי את המקום ✓";
  };
  box.appendChild(b);
 });
}
document.getElementById("placeName").addEventListener("input",e=>{
 selectedResult=null;const q=e.target.value.trim();clearTimeout(searchTimer);
 const box=document.getElementById("suggestions");
 if(q.length<2){box.innerHTML="";document.getElementById("addStatus").textContent="";return;}
 searchTimer=setTimeout(async()=>{
  document.getElementById("addStatus").textContent="🔎 מחפש עסקים ומקומות בבודפשט…";
  const list=await geoAutocomplete(q);renderSuggestions(list);
  document.getElementById("addStatus").textContent=list.length?"בחרו את המקום — את שאר הפרטים נשלים לבד ✓":"לא מצאתי עדיין — נסו את השם המלא באנגלית";
 },220);
});
function duplicateOf(found,label){
 const fLat=Number(found.lat),fLon=Number(found.lon),norm=normalizeName(label);
 return places.find(p=>{
  if(found.place_id&&p.geoapify_place_id===found.place_id)return true;
  if(normalizeName(p.name)===norm)return true;
  if(Number.isFinite(fLat)&&Number.isFinite(fLon)&&p.latitude!=null&&p.longitude!=null){
   const a={lat:fLat,lng:fLon},b={latitude:p.latitude,longitude:p.longitude};
   return dist(a,b)<35;
  }
  return false;
 });
}
async function buildPayload(found,manualNote=""){
 const details=await geoDetails(found.place_id),props=details||found;
 const label=props.name||found.name||found.address_line1||document.getElementById("placeName").value.trim();
 const cats=[...(props.categories||[]),...(found.category?[found.category]:[])];
 const cat=document.getElementById("placeCat").value||guessCategory(label,cats,props);
 const image=exactImage(props);
 const rawHours=props.opening_hours||props.datasource?.raw?.opening_hours||null;
 const desc=exactHebrewDescription(label,cat,cats,props);
 return {
  trip_id:TRIP,name:label,category:cat,address:props.formatted||found.formatted||null,
  latitude:Number(props.lat??found.lat),longitude:Number(props.lon??found.lon),
  description:desc,image_url:image,
  google_maps_url:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(label+" Budapest"),
  opening_hours:rawHours?{raw:String(rawHours)}:null,
  special:manualNote||null,visited:false,geoapify_place_id:found.place_id||null,
  website_url:props.website||props.datasource?.raw?.website||null,
  phone:props.contact?.phone||props.datasource?.raw?.phone||null,
  source:"geoapify",description_locked:false,last_enriched_at:new Date().toISOString(),last_seen_at:new Date().toISOString()
 };
}
async function addPlace(){
 const typed=document.getElementById("placeName").value.trim();if(!typed)return;
 const st=document.getElementById("addStatus");let found=selectedResult;
 if(!found){
  st.textContent="מחפש את המקום…";const list=await geoAutocomplete(typed);
  if(list.length===1)found=list[0];
  else if(list.length>1){renderSuggestions(list);st.textContent="בחרו קודם את המקום הנכון מהרשימה";return;}
 }
 if(!found){st.textContent="לא הצלחתי לזהות את המקום. נסו שם מדויק יותר.";return;}
 const label=found.name||found.address_line1||typed,dup=duplicateOf(found,label);
 if(dup){st.textContent=`${dup.name} כבר נמצא אצלכם ✓`;return;}
 st.textContent="✨ משלים כתובת, שעות, ניווט, זמן הליכה ותיאור בעברית…";
 const row=await buildPayload(found,document.getElementById("placeNote").value.trim());
 await sb("trip_places",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(row)});
 st.textContent="נוסף אצל שניכם ✓";
 setTimeout(()=>{
  document.getElementById("modalBg").style.display="none";
  document.getElementById("placeName").value="";document.getElementById("placeNote").value="";
  document.getElementById("placeCat").value="";document.getElementById("suggestions").innerHTML="";
  selectedResult=null;st.textContent="";
 },500);
 await loadPlaces();
}
async function enrichOne(p){
 // Never overwrite curated fields with guesses.
 try{
  let found=null;
  if(p.geoapify_place_id)found={place_id:p.geoapify_place_id,name:p.name,lat:p.latitude,lon:p.longitude,formatted:p.address};
  else{
   const list=await geoAutocomplete(p.name+" "+(p.address||""));
   found=list[0]||null;
  }
  if(!found)return;
  const details=await geoDetails(found.place_id),props=details||found,cats=[...(props.categories||[]),...(found.category?[found.category]:[])];
  const patch={last_seen_at:new Date().toISOString()};
  if(!p.geoapify_place_id&&found.place_id)patch.geoapify_place_id=found.place_id;
  if(!p.address&&props.formatted)patch.address=props.formatted;
  if(p.latitude==null&&Number.isFinite(Number(props.lat)))patch.latitude=Number(props.lat);
  if(p.longitude==null&&Number.isFinite(Number(props.lon)))patch.longitude=Number(props.lon);
  if(!p.image_url){
   const img=exactImage(props);
   if(img)patch.image_url=img; // exact-place image only
  }
  if(!p.opening_hours){
   const oh=props.opening_hours||props.datasource?.raw?.opening_hours;
   if(oh)patch.opening_hours={raw:String(oh)};
  }
  if(!p.website_url&&(props.website||props.datasource?.raw?.website))patch.website_url=props.website||props.datasource.raw.website;
  if(!p.phone&&(props.contact?.phone||props.datasource?.raw?.phone))patch.phone=props.contact?.phone||props.datasource.raw.phone;
  if(!p.description_locked&&(!p.description||p.source==="geoapify")){
   patch.description=exactHebrewDescription(p.name,p.category,cats,props);
  }
  if(Object.keys(patch).length>1){
   patch.last_enriched_at=new Date().toISOString();
   await sb(`trip_places?id=eq.${p.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(patch)});
  }
 }catch(e){}
}
let enrichBusy=false;
async function enrichExisting(){
 if(enrichBusy)return;enrichBusy=true;
 try{
  const candidates=places.filter(p=>!p.geoapify_place_id||!p.image_url||!p.opening_hours||p.latitude==null||(!p.description_locked&&(!p.description||p.source==="geoapify"))).slice(0,5);
  for(const p of candidates)await enrichOne(p);
  if(candidates.length)await loadPlaces();
 }finally{enrichBusy=false;}
}
