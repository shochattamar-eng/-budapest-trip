<style>
:root{--bg:#f7f7fb;--card:#fff;--text:#1d1d22;--muted:#777783;--accent:#7656f6;--green:#09875c;--red:#d44646;--border:#e7e7ee}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
button,input,select{font:inherit} .app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#fafcff,#f7f7fb)}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-weight:900;font-size:20px}.sub{font-size:12px;color:var(--muted)}.topBtns{display:flex;gap:8px}
.iconBtn,.hotelBtn{border:0;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.08);border-radius:999px;font-weight:850;cursor:pointer}
.iconBtn{width:43px;height:43px}.hotelBtn{padding:11px 14px;color:var(--accent)}
.hero{padding:18px 16px 8px}.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0;color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 16px 14px}.quick button{border:1px solid var(--border);background:white;border-radius:18px;padding:14px;font-weight:850}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 18px}.cat{border:1px solid var(--border);background:white;border-radius:18px;padding:18px 8px;font-weight:850}.cat .ico{display:block;font-size:28px;margin-bottom:6px}
.section{padding:0 16px 18px}.titleRow{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.titleRow h2{margin:0;font-size:20px}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.filter{border:1px solid var(--border);background:#fff;border-radius:999px;padding:9px 12px;font-weight:750;white-space:nowrap}.filter.active{background:var(--accent);color:#fff}
.cards{display:grid;gap:10px}.card{display:grid;grid-template-columns:100px 1fr;background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 5px 20px rgba(30,30,40,.05)}
.media{min-height:124px;background:linear-gradient(145deg,#eee9ff,#e7f5ff);display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover}
.body{padding:12px}.body h3{margin:0 0 5px;font-size:17px}.desc{font-size:13px;color:#56565e;line-height:1.45}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}.open{color:var(--green);font-weight:850}.closed{color:var(--red);font-weight:850}
.badge{display:inline-flex;margin-top:7px;background:#f1edff;color:#6748dd;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.action{border:0;border-radius:999px;padding:9px 12px;font-weight:850}.nav{background:var(--accent);color:#fff}.bolt{background:#eafff3;color:#07844f;border:1px solid #bcefd6}.visit{background:#f1f1f5}.visit.done{background:#e9fff1;color:#087045}
#mapView{display:none;padding:0 16px 18px}#map{height:460px;border-radius:20px;border:1px solid var(--border);overflow:hidden}
.bottom{position:sticky;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.bottom button{border:0;background:transparent;padding:8px 3px;font-size:11px;color:#5b5b64}.bottom b{display:block;font-size:20px;margin-bottom:3px}
.fab{position:fixed;left:18px;bottom:92px;z-index:60;width:58px;height:58px;border:0;border-radius:50%;background:var(--accent);color:white;font-size:34px;box-shadow:0 8px 28px rgba(118,86,246,.35)}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:none;align-items:flex-end;justify-content:center}.modal{width:min(760px,100%);background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 6px}.modal p{margin:0 0 14px;color:var(--muted);font-size:13px}.field{width:100%;border:1px solid var(--border);border-radius:14px;padding:13px;font-size:16px;margin-bottom:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary{width:100%;border:0;background:var(--accent);color:#fff;border-radius:14px;padding:14px;font-weight:900}.cancel{width:100%;border:0;background:#f2f2f6;border-radius:14px;padding:12px;font-weight:800;margin-top:8px}
.suggestions{display:grid;gap:8px;margin:-2px 0 10px}.suggestion{border:1px solid var(--border);background:#fff;border-radius:14px;padding:11px;text-align:right;cursor:pointer}.suggestion b{display:block;font-size:14px}.suggestion span{font-size:12px;color:var(--muted);display:block;margin-top:3px}.delete{background:#fff0f0;color:#b42318;border:1px solid #f4c7c7}.status{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;min-height:18px}.empty{background:#fff;border:1px dashed var(--border);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
@media(max-width:520px){.card{grid-template-columns:88px 1fr}.media{min-height:118px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div><div class="brand">Budapest שלנו 🇭🇺</div><div class="sub">4–8.9.2026 · Florin Apart Hotel</div></div>
  <div class="topBtns"><button class="iconBtn" id="nearTop">📍</button><button class="hotelBtn" id="hotelTop">🏠 למלון</button></div>
</header>
<section class="hero"><h1>ההמלצות שלנו</h1><p>מה שאחד מאיתנו מוסיף — מופיע אצל שנינו.</p></section>

 <div class="modal">

   <select class="field" id="placeCat">
    <option value="">קטגוריה אוטומטית</option>

   </select>

  </div>

 </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SB_URL="https://hydvaveanveeakwscbzi.supabase.co", SB_KEY="sb_publishable_wmGTgH-g5AEprg4XMVHe5g_iFVHEldg", TRIP="1b8857f8-b7e1-4d70-a43f-583d3287b132";
const GEO_KEY="54e8523b62d945a9a505a45f086e86b8";
const BUDAPEST_BIAS="19.0402,47.4979";
const HOTEL={name:"Florin Apart Hotel",lat:47.497139,lng:19.057972,address:"Károly körút 9, Budapest 1075"};
const categories=[["אוכל","🍴"],["בתי קפה","☕"],["ברים","🍸"],["אטרקציות","🎟️"],["מקומות יפים","📸"],["שווקים","🛍️"]];
const icons={"אוכל":"🍴","בתי קפה":"☕","ברים":"🍸","אטרקציות":"🎟️","מקומות יפים":"📸","שווקים":"🛍️"};
let places=[], currentCat=null,currentSort="default",userPos=null,map=null,userMarker=null,placeMarkers=[],selectedResult=null,searchTimer=null; const walkCache=new Map();

async function sb(path,opt={}){
 const r=await fetch(SB_URL+"/rest/v1/"+path,{...opt,headers:{apikey:SB_KEY,"Content-Type":"application/json",...(opt.headers||{})}});
 if(!r.ok)throw new Error(await r.text());
 const t=await r.text(); return t?JSON.parse(t):null;
}
async function loadPlaces(){
 places=await sb("trip_places?trip_id=eq."+TRIP+"&select=*&order=created_at.asc");
 render();
 if(map) refreshMapPins();
}
function gm(p,mode="walking"){const dest=p.address||p.name;return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=${mode}`;}
function minutes(t){const [h,m]=t.split(":").map(Number);return h*60+m;}
function nowBudapest(){const f=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Budapest",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}),x=f.formatToParts(new Date()),dm={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};return {day:dm[x.find(i=>i.type==="weekday").value],time:`${x.find(i=>i.type==="hour").value}:${x.find(i=>i.type==="minute").value}`};}
function dayCode(i){return ["Su","Mo","Tu","We","Th","Fr","Sa"][i];}
function parseTimeRange(range){
 const m=range.match(/(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})/);
 if(!m)return null;
 return {start:+m[1]*60 + +m[2], end:+m[3]*60 + +m[4]};
}
function dayMatches(expr,day){
 const codes=["Su","Mo","Tu","We","Th","Fr","Sa"], target=codes[day];
 return expr.split(",").some(part=>{
  part=part.trim();
  if(part===target)return true;
  const m=part.match(/^(Mo|Tu|We|Th|Fr|Sa|Su)-(Mo|Tu|We|Th|Fr|Sa|Su)$/);
  if(!m)return false;
  const a=codes.indexOf(m[1]), b=codes.indexOf(m[2]), t=codes.indexOf(target);
  return a<=b ? (t>=a&&t<=b) : (t>=a||t<=b);
 });
}
function rawOpeningStatus(raw){
 if(!raw)return {label:"שעות פתיחה לא זמינות",open:null};
 if(raw==="24/7")return {label:"פתוח 24/7",open:true};
 const n=nowBudapest(), now=minutes(n.time);
 for(const seg of raw.split(";")){
  const s=seg.trim();
  const m=s.match(/^([A-Za-z,-]+)\s+(.+)$/);
  if(!m||!dayMatches(m[1],n.day))continue;
  if(/off|closed/i.test(m[2]))return {label:"סגור היום",open:false};
  const r=parseTimeRange(m[2]); if(!r)continue;
  const ok=r.end<=r.start ? (now>=r.start||now<r.end) : (now>=r.start&&now<r.end);
  const endH=String(Math.floor(r.end/60)%24).padStart(2,"0")+":"+String(r.end%60).padStart(2,"0");
  return {label:ok?`פתוח עכשיו · עד ${endH}`:`סגור עכשיו · ${raw}`,open:ok};
 }
 return {label:"🕒 "+raw,open:null};
}
function status(p){
 if(!p.opening_hours) return {label:p.special?`📅 ${p.special}`:"שעות פתיחה לא זמינות",open:null};
 if(p.opening_hours.raw) return rawOpeningStatus(p.opening_hours.raw);
 const n=nowBudapest(),s=p.opening_hours[n.day];
 if(!s)return {label:"סגור היום",open:false};
 const a=minutes(n.time),st=minutes(s[0]),en=minutes(s[1]),ok=en<=st?(a>=st||a<en):(a>=st&&a<en);
 return {label:ok?`פתוח עכשיו · עד ${s[1]}`:`סגור עכשיו · ${s[0]}–${s[1]}`,open:ok};
}
function dist(a,b){const R=6371000,dla=(b.latitude-a.lat)*Math.PI/180,dlo=(b.longitude-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.latitude*Math.PI/180,x=Math.sin(dla/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function distanceLabel(p){
 if(!userPos||p.latitude==null||p.longitude==null)return "📍 הפעילו מיקום למרחק";
 const w=walkCache.get(p.id);
 if(w){
  const km=w.distance<1000?`${Math.round(w.distance)} מ׳`:`${(w.distance/1000).toFixed(1)} ק״מ`;
  return `🚶 ${km} · ${Math.max(1,Math.round(w.time/60))} דק׳`;
 }
 const m=Math.round(dist(userPos,p));
 return m<1000?`🚶 כ־${m} מ׳`:`🚶 כ־${(m/1000).toFixed(1)} ק״מ`;
}
function showList(){document.getElementById("mapView").style.display="none";document.getElementById("listView").style.display="block";}
function renderCats(){const el=document.getElementById("cats");el.innerHTML="";categories.forEach(([n,i])=>{const b=document.createElement("button");b.className="cat";b.innerHTML=`<span class="ico">${i}</span>${n}`;b.onclick=()=>{currentCat=n;currentSort="default";showList();render();};el.appendChild(b);});}
function filtered(){let a=currentCat?places.filter(p=>p.category===currentCat):[...places];if(currentSort==="open")a=a.filter(p=>status(p).open===true);if(currentSort==="unvisited")a=a.filter(p=>!p.visited);if(currentSort==="near"&&userPos)a.sort((x,y)=>(x.latitude?dist(userPos,x):999999)-(y.latitude?dist(userPos,y):999999));return a;}
function render(){if(document.getElementById("listView").style.display==="none")return;const a=filtered();document.getElementById("sectionTitle").textContent=currentCat||"המלצות";document.getElementById("count").textContent=`${a.length} מקומות`;const c=document.getElementById("cards");c.innerHTML="";if(!a.length){c.innerHTML='<div class="empty">אין כרגע מקומות במסנן הזה.</div>';return;}a.forEach(p=>{const s=status(p),ico=icons[p.category]||"📍";const card=document.createElement("article");card.className="card";card.innerHTML=`<div class="media">${p.image_url?`<img src="${p.image_url}" alt="">`:ico}</div><div class="body"><h3>${p.name}</h3><div class="desc">${p.description||""}</div>${p.special?`<span class="badge">${p.special}</span>`:""}<div class="meta"><span class="${s.open===true?"open":s.open===false?"closed":""}">${s.label}</span><span>${distanceLabel(p)}</span></div><div class="actions"><button class="action nav">נווט 🚶</button><button class="action bolt">Bolt 🚕</button><button class="action visit ${p.visited?"done":""}">${p.visited?"✓ היינו פה":"היינו פה"}</button><button class="action delete">מחק 🗑️</button></div></div>`;const [nav,bolt,visit,del]=card.querySelectorAll("button");nav.onclick=()=>window.open(gm(p),"_blank");bolt.onclick=()=>window.open("https://bolt.eu/en-hu/cities/budapest/","_blank");visit.onclick=async()=>{await sb(`trip_places?id=eq.${p.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({visited:!p.visited})});await loadPlaces();};del.onclick=async()=>{if(!confirm(`למחוק את ${p.name}?`))return;await sb(`trip_places?id=eq.${p.id}`,{method:"DELETE",headers:{Prefer:"return=minimal"}});await loadPlaces();};c.appendChild(card);});}
async function routeWalking(p){
 if(!userPos||p.latitude==null||p.longitude==null||walkCache.has(p.id))return;
 try{
  const u=`https://api.geoapify.com/v1/routing?waypoints=${userPos.lat},${userPos.lng}|${p.latitude},${p.longitude}&mode=walk&format=json&apiKey=${GEO_KEY}`;
  const r=await fetch(u); if(!r.ok)return;
  const j=await r.json(), x=j.results?.[0];
  if(x)walkCache.set(p.id,{distance:x.distance,time:x.time});
 }catch(e){}
}
async function refreshWalking(){
 const a=filtered().slice(0,20);
 await Promise.all(a.map(routeWalking));
 render();
}
function requestLocation(cb){
 if(!navigator.geolocation)return alert("אין גישה למיקום.");
 navigator.geolocation.getCurrentPosition(pos=>{
  userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};
  walkCache.clear(); render(); refreshWalking(); cb&&cb();
 },()=>alert("לא התקבלה הרשאת מיקום."),{enableHighAccuracy:true,timeout:9000});
}
function refreshMapPins(){if(!map)return;placeMarkers.forEach(m=>map.removeLayer(m));placeMarkers=[];places.forEach(p=>{if(p.latitude==null||p.longitude==null)return;const m=L.marker([p.latitude,p.longitude]).addTo(map).bindPopup(`<b>${icons[p.category]||"📍"} ${p.name}</b><br>${p.category}<br><a target="_blank" href="${gm(p)}">נווט ברגל</a>`);placeMarkers.push(m);});}
function showMap(){document.getElementById("listView").style.display="none";document.getElementById("mapView").style.display="block";if(!map){map=L.map("map").setView([47.499,19.056],13);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);L.marker([HOTEL.lat,HOTEL.lng]).addTo(map).bindPopup(`<b>🏨 ${HOTEL.name}</b><br><a target="_blank" href="${gm(HOTEL)}">נווט למלון</a>`);refreshMapPins();}setTimeout(()=>map.invalidateSize(),80);if(userPos){if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker([userPos.lat,userPos.lng],{radius:9,color:"#7656f6",fillColor:"#7656f6",fillOpacity:1}).addTo(map).bindPopup("אתם כאן").openPopup();map.setView([userPos.lat,userPos.lng],14);}}


function guessCategory(name,cats=[]){
 const s=(name+" "+cats.join(" ")).toLowerCase();
 if(/catering\.cafe|coffee|cafe|קפה/.test(s))return "בתי קפה";
 if(/catering\.bar|pub|nightclub|bar|club|בר/.test(s))return "ברים";
 if(/commercial\.marketplace|market|piac|שוק/.test(s))return "שווקים";
 if(/catering|restaurant|fast_food|pizza|burger|food|מסעד/.test(s))return "אוכל";
 if(/entertainment|tourism|heritage|museum|bath|stadium|sport|park|island|monument|castle|attraction/.test(s))return "אטרקציות";
 return "מקומות יפים";
}
function hebrewDescription(name,cat,cats=[]){
 const s=cats.join(" ").toLowerCase();
 if(cat==="בתי קפה")return `${name} הוא בית קפה בבודפשט, מתאים לעצירה לקפה, משהו מתוק או בראנץ׳ במהלך היום.`;
 if(cat==="ברים"){
  if(/nightclub/.test(s))return `${name} הוא מקום בילוי לילי בבודפשט עם אווירת בר ומוזיקה, מתאים לדרינק ויציאה בערב.`;
  return `${name} הוא בר בבודפשט, מתאים לדרינק ואווירה טובה בערב.`;
 }
 if(cat==="שווקים")return `${name} הוא שוק בבודפשט, מקום טוב להסתובב בין דוכנים, אוכל מקומי ומוצרים מיוחדים.`;
 if(cat==="אוכל"){
  if(/fast_food/.test(s))return `${name} הוא מקום אוכל קליל ופופולרי בבודפשט, מתאים לארוחה מהירה ולא מחייבת.`;
  return `${name} הוא מקום אוכל בבודפשט, מתאים לעצירה לארוחה במהלך הטיול.`;
 }
 if(cat==="אטרקציות"){
  if(/museum/.test(s))return `${name} הוא מוזיאון/אטרקציה בבודפשט שכדאי לשלב כשנמצאים באזור.`;
  if(/park|island/.test(s))return `${name} הוא מקום ירוק ונעים בבודפשט, מתאים להליכה, מנוחה וצילום.`;
  return `${name} הוא אחת האטרקציות שכדאי לשקול בבודפשט, בהתאם לאזור ולזמן שיש לכם.`;
 }
 return `${name} הוא מקום יפה בבודפשט שכדאי לשמור ברשימה ולעבור בו כשנמצאים באזור.`;
}
async function geoAutocomplete(q){
 const u=`https://api.geoapify.com/v1/geocode/autocomplete?text=${encodeURIComponent(q)}&format=json&lang=en&limit=7&filter=countrycode:hu&bias=proximity:${BUDAPEST_BIAS}&apiKey=${GEO_KEY}`;
 const r=await fetch(u); if(!r.ok)return [];
 const j=await r.json();
 return (j.results||[]).filter(x=>x.city==="Budapest"||/Budapest/i.test(x.formatted||""));
}
async function geoDetails(placeId){
 if(!placeId)return null;
 try{
  const u=`https://api.geoapify.com/v2/place-details?id=${encodeURIComponent(placeId)}&features=details&lang=en&apiKey=${GEO_KEY}`;
  const r=await fetch(u); if(!r.ok)return null;
  const j=await r.json();
  return j.features?.find(f=>f.properties?.feature_type==="details")?.properties||j.features?.[0]?.properties||null;
 }catch(e){return null;}
}
function renderSuggestions(list){
 const box=document.getElementById("suggestions");box.innerHTML="";
 list.forEach(r=>{
  const b=document.createElement("button");b.type="button";b.className="suggestion";
  const label=r.name||r.address_line1||r.formatted?.split(",")[0]||"מקום";
  b.innerHTML=`<b>${label}</b><span>${r.formatted||""}</span>`;
  b.onclick=()=>{
   selectedResult=r;
   document.getElementById("placeName").value=label;
   if(!document.getElementById("placeCat").value)document.getElementById("placeCat").value=guessCategory(label,r.category?[r.category]:[]);
   box.innerHTML="";
   document.getElementById("addStatus").textContent="מצאתי את המקום ✓";
  };
  box.appendChild(b);
 });
}
document.getElementById("placeName").addEventListener("input",e=>{
 selectedResult=null;
 const q=e.target.value.trim(); clearTimeout(searchTimer);
 const box=document.getElementById("suggestions");
 if(q.length<2){box.innerHTML="";return;}
 searchTimer=setTimeout(async()=>{
  document.getElementById("addStatus").textContent="מחפש בבודפשט…";
  const list=await geoAutocomplete(q);
  renderSuggestions(list);
  document.getElementById("addStatus").textContent=list.length?"בחרו את המקום הנכון":"לא מצאתי — נסו שם קצת יותר מדויק";
 },250);
});
async function placePayload(found,manualNote=""){
 const details=await geoDetails(found.place_id);
 const props=details||found;
 const label=props.name||found.name||found.address_line1||document.getElementById("placeName").value.trim();
 const cats=[...(props.categories||[]), ...(found.category?[found.category]:[])];
 const cat=document.getElementById("placeCat").value||guessCategory(label,cats);
 const image=props.wiki_and_media?.image||null;
 const rawHours=props.opening_hours||null;
 const desc=manualNote||hebrewDescription(label,cat,cats);
 return {
  trip_id:TRIP,name:label,category:cat,
  address:props.formatted||found.formatted||null,
  latitude:Number(props.lat??found.lat),longitude:Number(props.lon??found.lon),
  description:desc,image_url:image,
  google_maps_url:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(label+" Budapest"),
  opening_hours:rawHours?{raw:rawHours}:null,
  special:null,visited:false,geoapify_place_id:found.place_id||null
 };
}
async function addPlace(){
 const typed=document.getElementById("placeName").value.trim(); if(!typed)return;
 const st=document.getElementById("addStatus");
 let found=selectedResult;
 if(!found){
  st.textContent="מחפש את המקום…";
  const list=await geoAutocomplete(typed);
  if(list.length===1)found=list[0];
  else if(list.length>1){renderSuggestions(list);st.textContent="בחרו קודם את המקום הנכון מהרשימה";return;}
 }
 if(!found){st.textContent="לא הצלחתי לזהות את המקום. נסו שם מדויק יותר.";return;}
 const existing=places.find(p=>(found.place_id&&p.geoapify_place_id===found.place_id)||p.name.toLowerCase()===(found.name||typed).toLowerCase());
 if(existing){st.textContent="המקום כבר נמצא אצלכם ✓";return;}
 st.textContent="מוסיף תמונה, שעות, מיקום ותיאור…";
 const row=await placePayload(found,document.getElementById("placeNote").value.trim());
 await sb("trip_places",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(row)});
 st.textContent="נוסף אצל שניכם ✓";
 setTimeout(()=>{
  document.getElementById("modalBg").style.display="none";
  document.getElementById("placeName").value="";
  document.getElementById("placeNote").value="";
  document.getElementById("placeCat").value="";
  document.getElementById("suggestions").innerHTML="";
  selectedResult=null;st.textContent="";
 },550);
 await loadPlaces();
}
async function enrichExisting(){
 const missing=places.filter(p=>!p.geoapify_place_id||!p.image_url||!p.description||!p.opening_hours||p.latitude==null).slice(0,6);
 for(const p of missing){
  try{
   const list=await geoAutocomplete(p.name);
   if(!list.length)continue;
   const f=list[0], details=await geoDetails(f.place_id), props=details||f;
   const cats=[...(props.categories||[]), ...(f.category?[f.category]:[])];
   const patch={geoapify_place_id:f.place_id||p.geoapify_place_id};
   if(!p.address)patch.address=props.formatted||f.formatted||null;
   if(p.latitude==null)patch.latitude=Number(props.lat??f.lat);
   if(p.longitude==null)patch.longitude=Number(props.lon??f.lon);
   if(!p.image_url&&props.wiki_and_media?.image)patch.image_url=props.wiki_and_media.image;
   if(!p.opening_hours&&props.opening_hours)patch.opening_hours={raw:props.opening_hours};
   if(!p.description)patch.description=hebrewDescription(p.name,p.category,cats);
   if(Object.keys(patch).length)await sb(`trip_places?id=eq.${p.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(patch)});
  }catch(e){}
 }
 if(missing.length){places=await sb("trip_places?trip_id=eq."+TRIP+"&select=*&order=created_at.asc");render();if(map)refreshMapPins();}
}

document.getElementById("nearTop").onclick=()=>requestLocation(showMap);
document.getElementById("nearQuick").onclick=()=>requestLocation(showMap);
document.getElementById("openQuick").onclick=()=>{currentCat=null;currentSort="open";showList();render();};
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{currentSort=b.dataset.sort;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));if(currentSort==="near"&&!userPos)requestLocation(render);else render();});
document.getElementById("homeTab").onclick=()=>{currentCat=null;document.getElementById("listView").style.display="none";document.getElementById("mapView").style.display="none";window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("mapTab").onclick=()=>requestLocation(showMap);
document.getElementById("visitedTab").onclick=()=>{currentCat=null;currentSort="default";showList();const old=filtered;document.getElementById("sectionTitle").textContent="היינו פה";const a=places.filter(p=>p.visited);const c=document.getElementById("cards");document.getElementById("count").textContent=`${a.length} מקומות`;c.innerHTML=a.length?"":"<div class='empty'>עוד לא סימנתם מקומות.</div>";a.forEach(p=>{const card=document.createElement("article");card.className="card";card.innerHTML=`<div class="media">${p.image_url?`<img src="${p.image_url}">`:(icons[p.category]||"📍")}</div><div class="body"><h3>${p.name}</h3><div class="actions"><button class="action nav">נווט 🚶</button><button class="action visit done">✓ היינו פה</button></div></div>`;const [n,v]=card.querySelectorAll("button");n.onclick=()=>window.open(gm(p),"_blank");v.onclick=async()=>{await sb(`trip_places?id=eq.${p.id}`,{method:"PATCH",body:JSON.stringify({visited:false})});await loadPlaces();document.getElementById("visitedTab").click();};c.appendChild(card);});};
document.getElementById("addBtn").onclick=()=>document.getElementById("modalBg").style.display="flex";
document.getElementById("cancelModal").onclick=()=>document.getElementById("modalBg").style.display="none";
document.getElementById("savePlace").onclick=addPlace;
renderCats();loadPlaces().then(()=>enrichExisting());setInterval(loadPlaces,8000);
</script>
